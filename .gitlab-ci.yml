image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  FRONTEND_REPO: frontend-repo
  FRONTEND_STACK: frontend-stack
  IMAGE_TAG: latest

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD & PUSH =================
build-frontend:
  stage: build
  script:
    - |
      aws ecr describe-repositories \
        --repository-names "$FRONTEND_REPO" \
      || aws ecr create-repository \
        --repository-name "$FRONTEND_REPO"

    - |
      aws ecr get-login-password | docker login \
        --username AWS \
        --password-stdin \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

    - docker build -t $FRONTEND_REPO:$IMAGE_TAG .
    - docker tag $FRONTEND_REPO:$IMAGE_TAG \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG
    - docker push \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG
  only:
    - main

# ================= DEPLOY =================
deploy-frontend:
  stage: deploy
  needs: ["build-frontend"]
  script:
    # ---------- CREATE CLOUDFORMATION FILE ----------
    - |
      cat > frontend-stack.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: Frontend ECS Fargate with ALB (Health-check safe)

      Parameters:
        ImageURI:
          Type: String

      Resources:
        VPC:
          Type: AWS::EC2::VPC
          Properties:
            CidrBlock: 10.30.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true

        IGW:
          Type: AWS::EC2::InternetGateway

        AttachIGW:
          Type: AWS::EC2::VPCGatewayAttachment
          Properties:
            VpcId: !Ref VPC
            InternetGatewayId: !Ref IGW

        SubnetA:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.30.1.0/24
            AvailabilityZone: us-east-1a
            MapPublicIpOnLaunch: true

        SubnetB:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.30.2.0/24
            AvailabilityZone: us-east-1b
            MapPublicIpOnLaunch: true

        RouteTable:
          Type: AWS::EC2::RouteTable
          Properties:
            VpcId: !Ref VPC

        Route:
          Type: AWS::EC2::Route
          DependsOn: AttachIGW
          Properties:
            RouteTableId: !Ref RouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref IGW

        SubnetART:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetA
            RouteTableId: !Ref RouteTable

        SubnetBRT:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetB
            RouteTableId: !Ref RouteTable

        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Frontend ALB SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        TaskSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Frontend Task SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                SourceSecurityGroupId: !Ref ALBSG

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: "256"
            Memory: "512"
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: frontend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 80

        TargetGroup:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VPC
            Port: 80
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /health
            Matcher:
              HttpCode: 200

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref SubnetA, !Ref SubnetB]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TargetGroup

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref SubnetA, !Ref SubnetB]
                SecurityGroups: [!Ref TaskSG]
            LoadBalancers:
              - ContainerName: frontend
                ContainerPort: 80
                TargetGroupArn: !Ref TargetGroup

      Outputs:
        FrontendURL:
          Value: !GetAtt ALB.DNSName
      EOF

    # ---------- DEPLOY STACK ----------
    - |
      aws cloudformation deploy \
        --stack-name $FRONTEND_STACK \
        --template-file frontend-stack.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          ImageURI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG
  only:
    - main
