variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: ""
  FRONTEND_REPO: "frontend-repo"
  IMAGE_TAG: "latest"
  CLUSTER_NAME: ""
  BACKEND_URL: ""

stages:
  - validation
  - infra
  - docker
  - deploy

# Default image for AWS-only jobs.
# (docker stage overrides this with dind below.)
default:
  image: alpine:3.21
  before_script:
    - apk add --no-cache aws-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ==========================
# STAGE 1 - VALIDATION
# ==========================

validate-aws:
  stage: validation
  script:
    - echo "Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "Checking region is reachable..."
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "AWS credentials OK"
  only:
    - main

validate-dockerfile:
  stage: validation
  before_script: []
  script:
    - echo "Checking Dockerfile exists..."
    - 'test -f Dockerfile || { echo "ERROR: Dockerfile not found"; exit 1; }'
    - echo "Checking Dockerfile has required instructions..."
    - 'grep -qE "^FROM " Dockerfile || { echo "ERROR: FROM missing"; exit 1; }'
    - 'grep -qE "^(COPY|ADD) " Dockerfile || { echo "ERROR: COPY/ADD missing"; exit 1; }'
    - 'grep -qE "^(CMD|ENTRYPOINT) " Dockerfile || { echo "ERROR: CMD/ENTRYPOINT missing"; exit 1; }'
    - echo "Dockerfile validation passed"
  only:
    - main

validate-cluster:
  stage: validation
  script:
    - echo "Checking that EKS cluster $CLUSTER_NAME exists and is ACTIVE..."
    - |
      STATUS=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION" --query 'cluster.status' --output text)
      echo "Cluster status: $STATUS"
      if [ "$STATUS" != "ACTIVE" ]; then
        echo "ERROR: cluster $CLUSTER_NAME is not ACTIVE (status=$STATUS)"
        exit 1
      fi
    - echo "EKS cluster is ready"
  only:
    - main

# ==========================
# STAGE 2 - INFRA
# Make sure the ECR repo and the
# cluster permissions exist before
# we build / deploy.
# ==========================

infra-ecr:
  stage: infra
  needs: ["validate-aws"]
  script:
    - echo "Ensuring ECR repository exists..."
    - |
      aws ecr describe-repositories \
        --repository-names "$FRONTEND_REPO" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null \
      || aws ecr create-repository \
        --repository-name "$FRONTEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
        --image-scanning-configuration scanOnPush=true \
        --encryption-configuration encryptionType=AES256
    - echo "ECR repository ready"
  only:
    - main

infra-eks-access:
  stage: infra
  needs: ["validate-cluster"]
  script:
    - |
      echo "Granting gitlab-cicd-user admin access to EKS cluster..."
      CICD_USER_ARN=$(aws iam get-user --user-name gitlab-cicd-user --query 'User.Arn' --output text)
      aws eks create-access-entry \
        --cluster-name "$CLUSTER_NAME" \
        --principal-arn "$CICD_USER_ARN" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || echo "Access entry already exists"
      aws eks associate-access-policy \
        --cluster-name "$CLUSTER_NAME" \
        --principal-arn "$CICD_USER_ARN" \
        --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
        --access-scope type=cluster \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || echo "Policy already associated"
      echo "EKS access granted"
    - |
      echo "Attaching ELB permissions to node instance role..."
      NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'NodeInstanceRole')].RoleName" --output text)
      if [ -n "$NODE_ROLE" ]; then
        aws iam attach-role-policy --role-name "$NODE_ROLE" --policy-arn arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess 2>/dev/null || true
        echo "ELB permissions attached to $NODE_ROLE"
      else
        echo "No NodeInstanceRole found - skipping"
      fi
  only:
    - main

# ==========================
# STAGE 3 - DOCKER
# Build the Angular image and push to ECR.
# Uses Alpine 3.21 + dind (apk aws-cli works here).
# ==========================

docker-build:
  stage: docker
  needs: ["infra-ecr", "validate-dockerfile"]
  image: alpine:3.21
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache aws-cli docker-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "Logging in to ECR..."
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - echo "Building image..."
    - docker build -t "$FRONTEND_REPO:$IMAGE_TAG" .
    - docker tag "$FRONTEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG"
    - echo "Pushing image..."
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG"
    - echo "Image pushed to ECR successfully"
  only:
    - main

# ==========================
# STAGE 4 - DEPLOY
# Apply manifests to existing EKS cluster.
# ==========================

deploy-frontend:
  stage: deploy
  needs: ["docker-build", "infra-eks-access"]
  before_script:
    - apk add --no-cache aws-cli curl bash
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"
  script:
    - |
      cat > frontend-manifests.yaml <<EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        namespace: default
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: frontend
        template:
          metadata:
            labels:
              app: frontend
          spec:
            containers:
              - name: frontend
                image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${FRONTEND_REPO}:${IMAGE_TAG}
                imagePullPolicy: Always
                ports:
                  - containerPort: 80
                resources:
                  requests:
                    cpu: "125m"
                    memory: "128Mi"
                  limits:
                    cpu: "250m"
                    memory: "256Mi"
                livenessProbe:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 3
                readinessProbe:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: frontend
        ports:
          - port: 80
            targetPort: 80
            protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: frontend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/healthcheck-path: /
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      spec:
        ingressClassName: alb
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend
                      port:
                        number: 80
      EOF
      kubectl apply -f frontend-manifests.yaml
      echo "Frontend manifests applied"

    - kubectl rollout status deployment/frontend -n default --timeout=5m

    - |
      echo "Waiting for frontend ALB to be assigned..."
      FRONTEND_URL=""
      for i in $(seq 1 24); do
        FRONTEND_URL=$(kubectl get ingress frontend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$FRONTEND_URL" ]; then
          echo "Frontend live at: http://$FRONTEND_URL"
          break
        fi
        echo "attempt $i - waiting 15s..."
        sleep 15
      done

    - |
      echo "Updating backend CORS with frontend URL..."
      FRONTEND_URL=$(kubectl get ingress frontend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
      if [ -n "$FRONTEND_URL" ]; then
        kubectl set env deployment/backend CORS_ORIGINS="http://$FRONTEND_URL" -n default || echo "backend deployment not found - skipping CORS update"
        echo "Backend CORS updated to: http://$FRONTEND_URL"
      else
        echo "Frontend URL not yet assigned - CORS will need manual update"
      fi
  only:
    - main
