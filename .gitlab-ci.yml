image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  FRONTEND_REPO: frontend-repo
  FRONTEND_STACK: frontend-stack
  IMAGE_TAG: latest

stages:
  - validation
  - infra
  - docker
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ==========================
# STAGE 1 - VALIDATION
# ==========================

validate-aws:
  stage: validation
  script:
    - echo "Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "Checking region is reachable..."
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "AWS credentials OK"
  only:
    - main

validate-dockerfile:
  stage: validation
  script:
    - echo "Checking Dockerfile exists..."
    - 'test -f Dockerfile || { echo "ERROR: Dockerfile not found"; exit 1; }'
    - echo "Checking Dockerfile has required instructions..."
    - 'grep -qE "^FROM " Dockerfile || { echo "ERROR: FROM missing"; exit 1; }'
    - 'grep -qE "^(COPY|ADD) " Dockerfile || { echo "ERROR: COPY/ADD missing"; exit 1; }'
    - 'grep -qE "^(CMD|ENTRYPOINT) " Dockerfile || { echo "ERROR: CMD/ENTRYPOINT missing"; exit 1; }'
    - echo "Dockerfile validation passed"
  only:
    - main

validate-cfn-template:
  stage: validation
  script:
    - echo "Rendering CloudFormation template for validation..."
    - |
      cat > frontend-stack.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: Frontend ECS Fargate with ALB (Health-check safe)

      Parameters:
        ImageURI:
          Type: String

      Resources:
        VPC:
          Type: AWS::EC2::VPC
          Properties:
            CidrBlock: 10.30.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true

        IGW:
          Type: AWS::EC2::InternetGateway

        AttachIGW:
          Type: AWS::EC2::VPCGatewayAttachment
          Properties:
            VpcId: !Ref VPC
            InternetGatewayId: !Ref IGW

        SubnetA:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.30.1.0/24
            AvailabilityZone: us-east-1a
            MapPublicIpOnLaunch: true

        SubnetB:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.30.2.0/24
            AvailabilityZone: us-east-1b
            MapPublicIpOnLaunch: true

        RouteTable:
          Type: AWS::EC2::RouteTable
          Properties:
            VpcId: !Ref VPC

        Route:
          Type: AWS::EC2::Route
          DependsOn: AttachIGW
          Properties:
            RouteTableId: !Ref RouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref IGW

        SubnetART:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetA
            RouteTableId: !Ref RouteTable

        SubnetBRT:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetB
            RouteTableId: !Ref RouteTable

        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Frontend ALB SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        TaskSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Frontend Task SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                SourceSecurityGroupId: !Ref ALBSG

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        LogGroup:
          Type: AWS::Logs::LogGroup
          Properties:
            LogGroupName: /ecs/frontend
            RetentionInDays: 7

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          DependsOn: LogGroup
          Properties:
            Cpu: "256"
            Memory: "512"
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: frontend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 80
                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: /ecs/frontend
                    awslogs-region: !Ref AWS::Region
                    awslogs-stream-prefix: frontend

        TargetGroup:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VPC
            Port: 80
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /
            HealthCheckIntervalSeconds: 30
            HealthCheckTimeoutSeconds: 10
            HealthyThresholdCount: 2
            UnhealthyThresholdCount: 5
            Matcher:
              HttpCode: 200-399

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref SubnetA, !Ref SubnetB]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TargetGroup

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            HealthCheckGracePeriodSeconds: 60
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref SubnetA, !Ref SubnetB]
                SecurityGroups: [!Ref TaskSG]
            LoadBalancers:
              - ContainerName: frontend
                ContainerPort: 80
                TargetGroupArn: !Ref TargetGroup

      Outputs:
        FrontendURL:
          Value: !GetAtt ALB.DNSName
      EOF
    - aws cloudformation validate-template --template-body file://frontend-stack.yaml --region "$AWS_DEFAULT_REGION"
    - echo "CloudFormation template is valid"
  artifacts:
    paths:
      - frontend-stack.yaml
    expire_in: 1 hour
  only:
    - main

# ==========================
# STAGE 2 - INFRA
# ECR repo only - the rest of
# the AWS infra is created by
# CloudFormation in deploy.
# ==========================

infra-ecr:
  stage: infra
  needs: ["validate-aws"]
  script:
    - echo "Ensuring ECR repository exists..."
    - |
      aws ecr describe-repositories \
        --repository-names "$FRONTEND_REPO" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null \
      || aws ecr create-repository \
        --repository-name "$FRONTEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
        --image-scanning-configuration scanOnPush=true \
        --encryption-configuration encryptionType=AES256
    - echo "ECR repository ready"
  only:
    - main

# ==========================
# STAGE 3 - DOCKER
# Build and push image to ECR
# ==========================

docker-build:
  stage: docker
  needs: ["infra-ecr", "validate-dockerfile"]
  script:
    - echo "Logging in to ECR..."
    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login \
        --username AWS \
        --password-stdin \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - echo "Building image..."
    - docker build -t "$FRONTEND_REPO:$IMAGE_TAG" .
    - docker tag "$FRONTEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG"
    - echo "Pushing image..."
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG"
    - echo "Image pushed to ECR successfully"
  only:
    - main

# ==========================
# STAGE 4 - DEPLOY
# Deploy CloudFormation stack
# ==========================

deploy-frontend:
  stage: deploy
  needs: ["docker-build", "validate-cfn-template"]
  script:
    - echo "Deploying CloudFormation stack..."
    - |
      aws cloudformation deploy \
        --stack-name "$FRONTEND_STACK" \
        --template-file frontend-stack.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --region "$AWS_DEFAULT_REGION" \
        --no-fail-on-empty-changeset \
        --parameter-overrides \
          ImageURI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG

    - echo "Fetching frontend URL..."
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name "$FRONTEND_STACK" \
        --region "$AWS_DEFAULT_REGION" \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text)
      echo "FRONTEND LIVE AT: http://$FRONTEND_URL"
  only:
    - main
