server {
  listen 80;
  server_name _;

  # Increase client body size for uploads
  client_max_body_size 10M;

  root /usr/share/nginx/html;
  index index.html  index.htm;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;

  # Cache control for static assets - aggressive caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
  }
  
  # Specific optimization for images - add additional headers
  location ~* ^/assets/.*\.(jpg|jpeg|png|gif|webp)$ {
    expires 90d;
    add_header Cache-Control "public, max-age=7776000, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
  }

  location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
    access_log off;
  }

  # SPA routing - serve index.html for all non-file requests
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
    access_log off;
  }

  location ~ ~$ {
    deny all;
    access_log off;
  }
}
