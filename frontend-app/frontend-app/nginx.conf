server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ ALB / ECS health check
  location /health {
    access_log off;
    default_type text/plain;
    return 200 "OK";
  }

  # Angular routing support
  location / {
    try_files $uri $uri/ /index.html;
  }
}
