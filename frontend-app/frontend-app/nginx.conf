server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        allow all;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        allow all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        allow all;
        expires 1h;
        access_log off;
    }
}
