<div class="checkout-container">

  <!-- CUSTOMER FORM -->
  <div class="checkout-left">
    <h2 class="section-title">Customer Details</h2>

    <form (ngSubmit)="placeOrder()" class="checkout-form">

      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="customer.name" name="name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="customer.email" name="email" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="customer.phone" name="phone" required>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea [(ngModel)]="customer.address" name="address" required></textarea>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>

      <button class="checkout-btn" type="submit" [disabled]="submitting">
        {{ submitting ? 'Placing Order...' : 'Place Order' }}
      </button>

    </form>
  </div>


  <!-- ORDER SUMMARY -->
  <div class="checkout-right">

    <h2 class="section-title">Order Summary</h2>

    <div class="summary-card" *ngFor="let item of cartItems">

      <img [src]="item.image" alt="{{ item.name }}">

      <div class="summary-info">
        <h3>{{ item.name }}</h3>
        <p>Qty: {{ item.quantity }}</p>
        <p class="price">₹{{ subtotal(item) }}</p>
      </div>

    </div>

    <div class="total-box">
      <p>Subtotal: <span>₹{{ total() }}</span></p>
      <p>Delivery: <span>₹0</span></p>
      <hr>
      <p class="final-total">Total: <span>₹{{ total() }}</span></p>
    </div>

  </div>

</div>
