<!-- Chat Widget -->
<div class="fixed bottom-4 right-4 z-50">
  <!-- Chat Toggle Button -->
  <button 
    *ngIf="!isOpen"
    (click)="toggleChat()"
    class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-4 shadow-lg transition-all duration-300 hover:scale-110">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
    </svg>
  </button>

  <!-- Chat Window -->
  <div 
    *ngIf="isOpen"
    class="bg-white rounded-lg shadow-2xl w-80 h-96 flex flex-col border border-gray-200">
    
    <!-- Chat Header -->
    <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 bg-green-400 rounded-full"></div>
        <span class="font-semibold">Shopping Assistant</span>
      </div>
      <button 
        (click)="toggleChat()"
        class="text-white hover:text-gray-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Messages Container -->
    <div 
      #messagesContainer
      class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
      
      <div 
        *ngFor="let message of messages" 
        class="flex"
        [ngClass]="{'justify-end': message.isUser, 'justify-start': !message.isUser}">
        
        <div 
          class="max-w-xs px-3 py-2 rounded-lg text-sm"
          [ngClass]="{
            'bg-blue-600 text-white': message.isUser,
            'bg-white text-gray-800 border border-gray-200': !message.isUser
          }">
          {{ message.message }}
        </div>
      </div>

      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="flex justify-start">
        <div class="bg-white text-gray-800 border border-gray-200 max-w-xs px-3 py-2 rounded-lg text-sm">
          <div class="flex space-x-1">
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-200 bg-white rounded-b-lg">
      <div class="flex space-x-2">
        <input 
          type="text"
          [(ngModel)]="currentMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Type your message..."
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [disabled]="isLoading">
        
        <button 
          (click)="sendMessage()"
          [disabled]="!currentMessage.trim() || isLoading"
          class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white rounded-lg px-4 py-2 text-sm transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
